# Default build for lifestyle template.
# Override in each Netlify site: Base directory = templates/lifestyle (or food-blogger / style-blogger)

[build]
  base = "templates/lifestyle"
  command = "npm install && npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
